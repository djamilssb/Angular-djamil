<div class="search-container">
    <input [(ngModel)]="query" (input)="search()" placeholder="Rechercher un produit">
    <div class="results">
      <div *ngFor="let product of results" class="product">
        <img [src]="product.imageUrl" alt="{{ product.name }}">
        <h2>{{ product.name }}</h2>
        <p>Prix: {{ product.price }} €</p>
      </div>
    </div>
</div>
